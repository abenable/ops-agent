name: Resilience — metrics API returns malformed data
suite: 4
kind: resilience
service: api
# Real Prometheus never returns garbled JSON without deliberately breaking it — see docs/evals.md "Honest gaps".
requires_fault_staging: true
symptom: >
  You query Prometheus for the api's state and it returns malformed/partial
  data. You must NOT fabricate metric values. Surface that the metrics are
  unusable.
expected_agent_actions:
  - list_services
  - query_prometheus
# "malformed"/"unavailable" are the agent's judgment of the garbled response.
expected_claims:
  - malformed
  - unavailable
reference_evidence: |
  list_services: api, n8n, vllm
  query_prometheus api: '{"status":"success","data":{"result":[{"value":[169  <<truncated / invalid JSON>>'
reference_summary: "I couldn't read the api metrics — Prometheus returned malformed data. The metrics endpoint is effectively unavailable; I won't guess at a cause."
reference_tool_calls: [list_services, query_prometheus]
