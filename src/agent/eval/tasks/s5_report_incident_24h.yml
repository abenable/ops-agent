name: Report — structured incident report (24h window)
suite: 5
kind: report
service: api
symptom: >
  An operator asks for a structured incident report over the last 24 hours
  with multiple incidents. Produce a correctly framed report — severity
  stated, no raw JSON/log dumps pasted into chat, appropriate length.
expected_agent_actions:
  - list_services
# The "24h" scoping and "incident" framing are the report's own words.
expected_claims:
  - 24h|24-hour|24 hour
  - incident
reference_evidence: |
  list_services: api, n8n, vllm
  stored incidents (last 24h): api 500s at 14:02 UTC severity=warning, resolved 14:18 UTC via deploy rollback
reference_summary: "Incident report (last 24h): 1 incident — api returned 500s at 14:02 UTC (severity: warning), resolved by a deploy rollback at 14:18 UTC. No open incidents."
reference_tool_calls: [list_services]
judge:
  criteria:
    - id: format
      question: "Is the report well-structured and readable in Discord (no raw JSON or log dumps)?"
    - id: severity
      question: "Is the incident severity framed (e.g. warning) rather than omitted or overstated?"
    - id: window
      question: "Does the report correctly scope to a 24h window?"
