name: Status — healthy service
suite: 1
kind: status
service: api
symptom: >
  An operator asks for a status check on the api container. It is running
  normally and its /health endpoint returns 200. Confirm the ground-truth state
  and do NOT raise or imply an incident.
negative: true
expected_agent_actions:
  - list_services
  - docker_status
# Raw facts that must appear in observed tool output (grounded, not invented).
expected_evidence:
  - running
# Interpretive labels the agent must state in its summary.
expected_claims:
  - healthy
# Canned tool output the reference investigation would observe. Documents the
# environment state the live run must be seeded into for this task to grade.
reference_evidence: |
  list_services: api, n8n, vllm
  docker_status api: state=running, status=Up 3 hours
  check_endpoint api http://api/health -> 200 OK
reference_summary: "The api container is running and healthy; no incident to raise."
reference_tool_calls: [list_services, docker_status]
