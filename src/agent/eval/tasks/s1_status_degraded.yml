name: Status — degraded service
suite: 1
kind: status
service: n8n
# Real n8n is idle (no sustained CPU load staged) — see docs/evals.md "Honest gaps".
requires_fault_staging: true
symptom: >
  An operator asks for a status check on n8n. The container is up but under
  sustained CPU load and responding slowly. Report the ground-truth state as
  degraded (not "down", not "healthy").
expected_agent_actions:
  - list_services
  - docker_status
  - query_prometheus
expected_evidence:
  - n8n
expected_claims:
  - degraded
reference_evidence: |
  list_services: api, n8n, vllm
  docker_status n8n: state=running, status=Up 2 hours
  query_prometheus n8n cpu: 0.94 (sustained high); response latency p95 elevated
reference_summary: "The n8n container is up but degraded: elevated CPU and slow responses."
reference_tool_calls: [list_services, docker_status, query_prometheus]
