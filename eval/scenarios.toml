# The errors are pushed straight into Loki, dated about 45 minutes back: the
# worker's own Docker log never had them, and `query_loki` only looks back 15
# minutes, so only a range query that reaches that far finds them.
[[task]]
id = "log-window"
category = "lookup"
difficulty = "medium"
question = "Did lab-worker log any errors in the last hour? If so, what were they?"
settle_sec = 15
inject = '''
now=$(date +%s)
entry() { printf '["%s000000000", "%s %s"]' "$1" "$(date -u -d "@$1" '+%Y-%m-%d %H:%M:%S,000')" "$2"; }
values="$(entry $((now - 2700)) 'ERROR flush failed: connection reset by peer (batch 4812)')"
values="$values,$(entry $((now - 2640)) 'ERROR flush failed: connection reset by peer (batch 4813)')"
values="$values,$(entry $((now - 2580)) 'WARNING retry budget exhausted, dropping batch 4813')"
wget -q -O /dev/null --header 'Content-Type: application/json' \
  --post-data "{\"streams\":[{\"stream\":{\"container\":\"lab-worker\"},\"values\":[$values]}]}" \
  http://dind:3100/loki/api/v1/push
'''

[task.expect]
mention_all = [["connection reset"]]
tools_any = ["query_loki_range"]

