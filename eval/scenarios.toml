# The worker fills its disk and exits, and its container is then removed, so
# Docker has nothing left to show: its last words exist only in Loki. The
# disk is larger than in `disk-full` so the worker lives long enough for Alloy
# to pick up its logs before it dies.
[[task]]
id = "logs-after-removal"
category = "diagnosis"
difficulty = "hard"
question = "lab-worker crashed and its container has since been removed. What made it crash?"
settle_sec = 20
overlay = """
services:
  worker:
    environment: {MODE: disk}
    tmpfs: ["/data:size=64m"]
    restart: "no"
"""
inject = """
until [ "$(docker inspect -f '{{.State.Status}}' lab-worker)" = exited ]; do sleep 2; done
sleep 10
docker rm lab-worker
"""

[task.expect]
mention_all = [["space", "disk", "full", "enospc", "errno 28"]]
mention_none = ["out of memory", "oomkill", "oom-kill", "oom kill"]
tools_any = ["query_loki", "query_loki_range"]
sections = true

