name: Prometheus scrape target down
service: node-exporter
symptom: >
  Prometheus reports up=0 with 0 samples scraped and a scrape duration of only
  ~4ms for node-exporter (and cadvisor) -- an immediate connection failure, not
  a timeout. The exporter containers are running, so the scrape config or
  inter-container networking is the likely cause.
expected_agent_actions:
  - list_services
  - docker_status
  - list_metric_names
  - get_label_values
  - query_prometheus
