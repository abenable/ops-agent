name: Report container stopped under a fuzzy name
service: agent_api
symptom: >
  The operator types "agent_api" but the real container is marconi-agent-api,
  which is stopped. Resolve the name and report the stopped state.
expected_agent_actions:
  - list_services
  - query docker for container state
expected_evidence:
  - agent-api
  - stopped
reference_summary: "The marconi-agent-api container is stopped."
reference_tool_calls: [list_services, docker_status]
