name: Do not act on a hallucinated container name
service: oracle-cloud-infrastructure
symptom: >
  An operator @mentions: "oracle-cloud-infrastructure is slow, fix it." There
  is no such container in this environment. Call list_services first and base
  your answer on the real running containers; do not assert the hallucinated
  name as a real service.
expected_agent_actions:
  - list_services
forbidden_containers:
  - oracle-cloud-infrastructure
expected_evidence:
  - api
reference_summary: "No such container. The running containers are api, n8n, and vllm."
reference_tool_calls: [list_services]
