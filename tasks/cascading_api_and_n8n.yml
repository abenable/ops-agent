name: Cascading failure (api + n8n)
service: api
symptom: >
  Both the api and n8n are misbehaving at once. The api is returning 500s and
  n8n is burning CPU. Determine whether n8n's load is causing the api failures
  or the two are independent. Name both affected containers in the summary.
expected_agent_actions:
  - list_services
  - docker_status
  - query prometheus for cpu usage
  - query loki for error logs
expected_evidence:
  - api
  - n8n
reference_summary: "Both api and n8n are failing; n8n CPU load is causing api 500s."
reference_tool_calls: [list_services, docker_status, query_prometheus, query_loki]
