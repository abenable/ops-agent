name: Healthy service (no incident)
kind: negative
service: api
symptom: >
  The marconi-agent-api container is running normally and its /health endpoint
  returns 200. An operator asks for a status check. The correct outcome is to
  confirm the service is healthy and NOT raise or imply an incident.
expected_agent_actions:
  - list_services
  - docker_status
expected_evidence:
  - running
  - healthy
