name: Report request rate
kind: perf
service: api
symptom: >
  Traffic to the api just spiked. The operator wants the request rate from
  Prometheus to confirm the load.
expected_agent_actions:
  - list_services
  - query prometheus for request rate
expected_metric_family: request_rate
expected_evidence:
  - api
  - request
reference_summary: "api request rate is spiking."
reference_tool_calls: [list_services, list_metric_names, query_prometheus]
