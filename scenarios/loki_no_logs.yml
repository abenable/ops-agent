name: Loki has no logs for n8n
service: n8n
symptom: >
  query_loki returns zero log lines for n8n even though the container is
  running and producing logs. Promtail may have stopped shipping n8n logs into
  Loki.
expected_agent_actions:
  - list_services
  - docker_status
  - query_loki
  - docker_logs
