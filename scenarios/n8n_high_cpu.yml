name: n8n under high CPU load
service: n8n
symptom: >
  The n8n instance is under sustained load and its CPU rate is elevated. The
  operator wants to confirm which container is burning CPU and whether a
  workflow run is stuck.
expected_agent_actions:
  - list_services
  - docker_status
  - list_metric_names
  - query_prometheus
  - docker_logs
