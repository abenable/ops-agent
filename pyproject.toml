[project]
name = "agent"
version = "0.1.0"
description = "Infrastructure operations agent MVP with Discord interface, workflows, and self-hosted LLM integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-openai>=1.3.5",
    "discord.py>=2.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx2>=2.7.0",
]

[project.scripts]
agent = "agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: live external API checks (LLM, Discord, etc.)",
]
