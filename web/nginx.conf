server {
    listen 8088;
    server_name _;

    # SPA — try_files so TanStack Router owns client-side routing
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Internal proxy to the api on the shared host network (loopback).
    # Trailing slash on proxy_pass strips the /api prefix, matching the
    # FastAPI routes which live at /, not /api.
    location /api/ {
        proxy_pass http://127.0.0.1:8123/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: /ask/stream and /incidents/{service}/stream must stream unbuffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding off;
    }
}
