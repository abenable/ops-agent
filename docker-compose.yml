configs:
  prometheus-config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']

        - job_name: 'n8n'
          static_configs:
            - targets: ['n8n:5678']
          metrics_path: /metrics

        - job_name: 'node-exporter'
          static_configs:
            - targets: ['node-exporter:9100']

        - job_name: 'cadvisor'
          static_configs:
            - targets: ['cadvisor:8080']

  loki-config:
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100
        grpc_listen_port: 9096

      common:
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      schema_config:
        configs:
          - from: 2020-10-24
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      analytics:
        reporting_enabled: false

  promtail-config:
    content: |
      server:
        http_listen_port: 9080
        grpc_listen_port: 0

      positions:
        filename: /tmp/positions.yaml

      clients:
        - url: http://loki:3100/loki/api/v1/push

      scrape_configs:
        - job_name: n8n-logs
          static_configs:
            - targets:
                - localhost
              labels:
                job: n8n-logs
                service: n8n
                __path__: /home/node/.n8n/n8n.log

services:
  api:
    container_name: marconi-agent-api
    build: .
    env_file: .env
    # Use host networking so the API can reach the host-mapped Prometheus/Loki
    # ports on localhost and the external LLM endpoint (the default bridge here
    # has no outbound internet access).
    network_mode: host
    volumes:
      - ./data:/app/data
      # Read-only host daemon access for the Docker tools (container discovery, logs).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["python", "-m", "agent", "api"]
    restart: unless-stopped
    environment:
      # Keep the same host port that was previously mapped by compose.
      API_PORT: 8123
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8123/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - prometheus
      - loki

  bot:
    container_name: marconi-agent-bot
    build: .
    env_file: .env
    # Use host networking so the bot can reach Prometheus/Loki on localhost
    # and the external LLM endpoint, just like the API.
    network_mode: host
    volumes:
      - ./data:/app/data
      # Read-only host daemon access so /status, /containers, and /menu see host containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["python", "-m", "agent", "bot"]
    restart: unless-stopped
    environment:
      # Monitor the local services that are reachable from the host network.
      MONITORED_ENDPOINTS: "agent_api=http://localhost:8123/health,n8n=http://localhost:5678"
    depends_on:
      - prometheus
      - loki

  prometheus:
    container_name: marconi-agent-prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prom_data:/prometheus
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  loki:
    container_name: marconi-agent-loki
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    configs:
      - source: loki-config
        target: /etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  n8n:
    container_name: marconi-agent-n8n
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      # Expose Prometheus metrics on /metrics (scraped by prometheus).
      N8N_METRICS: "true"
      N8N_METRICS_INCLUDE_DEFAULT_METRICS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: "UTC"
    # Redirect n8n's stdout/stderr into its data volume so Promtail can ship
    # the logs to Loki. Override the entrypoint so the args aren't re-interpreted
    # by the image's `n8n "$@"` wrapper; `exec` keeps n8n as PID 1.
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec n8n start > /home/node/.n8n/n8n.log 2>&1"]
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  promtail:
    container_name: marconi-agent-promtail
    image: grafana/promtail:latest
    volumes:
      - n8n_data:/home/node/.n8n
    configs:
      - source: promtail-config
        target: /etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
      - n8n
    restart: unless-stopped

volumes:
  prom_data:
  loki_data:
  n8n_data:
