services:
  bot:
    container_name: marconi-agent-bot
    build: .
    env_file: .env
    network_mode: host
    volumes:
      - ./data:/app/data
      # `:ro` restricts the socket file, not the Engine API behind it. Read-only
      # is guaranteed by agent/tools/ exposing no mutating call, not by this flag.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["python", "-m", "agent", "bot"]
    restart: unless-stopped
