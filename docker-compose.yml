configs:
  prometheus-config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']

        - job_name: 'node-exporter'
          static_configs:
            - targets: ['node-exporter:9100']

        - job_name: 'cadvisor'
          static_configs:
            - targets: ['cadvisor:8080']

  loki-config:
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100
        grpc_listen_port: 9096

      common:
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      schema_config:
        configs:
          - from: 2020-10-24
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      analytics:
        reporting_enabled: false

  promtail-config:
    content: |
      server:
        http_listen_port: 9080
        grpc_listen_port: 0

      positions:
        filename: /tmp/positions.yaml

      clients:
        - url: http://loki:3100/loki/api/v1/push

      scrape_configs:
        - job_name: docker-logs
          docker_sd_configs:
            - host: unix:///var/run/docker.sock
              refresh_interval: 15s
          relabel_configs:
            - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
              target_label: 'service'
            - source_labels: ['__meta_docker_container_name']
              regex: '/?(.*)'
              target_label: 'container'
              replacement: '$1'
            - target_label: 'job'
              replacement: 'docker-logs'

services:
  bot:
    container_name: marconi-agent-bot
    build: .
    env_file: .env
    # Use host networking so the bot can reach Prometheus/Loki on localhost
    # and the external LLM endpoint.
    network_mode: host
    volumes:
      - ./data:/app/data
      # Host daemon access so /status, /containers, and the Docker tools see
      # host containers. NOTE: `:ro` only makes the socket *file* read-only —
      # the Engine API behind it is still fully writable, and socket access is
      # root-equivalent on the host. The read-only guarantee comes from the
      # tool surface (agent/tools/ exposes no mutating call), not this flag.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["python", "-m", "agent", "bot"]
    restart: unless-stopped
    environment:
      # Monitor the local services that are reachable from the host network.
      MONITORED_ENDPOINTS: "prometheus=http://localhost:9090/-/healthy,loki=http://localhost:3100/ready"
    depends_on:
      - prometheus
      - loki

  prometheus:
    container_name: marconi-agent-prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    # The bot runs on network_mode: host, so it's reachable from this
    # bridge-networked container only via the host gateway, not by service name.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - prom_data:/prometheus
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  loki:
    container_name: marconi-agent-loki
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    configs:
      - source: loki-config
        target: /etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    container_name: marconi-agent-promtail
    image: grafana/promtail:latest
    volumes:
      # Docker Engine API access for the docker_sd_configs job below. As above,
      # `:ro` does not restrict the API; promtail only ever reads from it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: promtail-config
        target: /etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  prom_data:
  loki_data:
